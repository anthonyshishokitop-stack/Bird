<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#5eb8ff"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Chirp</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐦</text></svg>"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#020617;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;color:#f8fafc;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none}
body{display:flex;align-items:center;justify-content:center;min-height:100dvh}
#wrap{position:relative;width:min(100vw,calc(100dvh*9/16),420px);height:100dvh;overflow:hidden;background:#5eb8ff;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 25px 80px rgba(0,0,0,.6)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;z-index:10;display:flex;flex-direction:column}
.top-bar{display:flex;align-items:flex-start;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 12px 0;gap:8px}
.score-block{flex:1;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.2),0 4px 14px rgba(0,0,0,.35)}
.score-num{font-size:clamp(2.6rem,11vw,3.6rem);font-weight:900;letter-spacing:-.04em;line-height:1}
.score-sub{font-size:.78rem;font-weight:700;opacity:.9;margin-top:2px}
.icon-btn{pointer-events:auto;width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(15,23,42,.82);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(12px);transition:transform .1s}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:20px;height:20px;pointer-events:none}
.power-row{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:26px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:800;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14)}
.pill.shield{color:#7dd3fc;border-color:rgba(125,211,252,.4)}
.pill.boost{color:#fbbf24;border-color:rgba(251,191,36,.4)}
.pill.wing{color:#fde68a}
.pill.coins{color:#fbbf24}
.pill.safe{color:#c4b5fd;border-color:rgba(196,181,253,.4)}
.meter-track{width:58%;max-width:170px;height:7px;margin:8px auto 0;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.meter-fill{height:100%;width:0%;border-radius:inherit;background:linear-gradient(90deg,#2dd4bf,#fbbf24);transition:width .06s linear}
.panel{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(88%,320px);background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:24px 20px 18px;text-align:center;pointer-events:auto;backdrop-filter:blur(18px);box-shadow:0 24px 60px rgba(0,0,0,.5);animation:panelIn .3s cubic-bezier(.22,1.15,.36,1) both}
@keyframes panelIn{from{opacity:0;transform:translate(-50%,-44%) scale(.9)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.panel h1{font-size:2rem;font-weight:900;letter-spacing:-.03em;margin-bottom:4px}
.panel .tagline{font-size:.9rem;color:rgba(248,250,252,.7);margin-bottom:18px}
.panel .big-score{font-size:3.4rem;font-weight:900;line-height:1;margin:4px 0 2px;letter-spacing:-.04em}
.panel .best-line{font-size:.88rem;color:rgba(248,250,252,.7);margin-bottom:16px}
.new-best{display:inline-block;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#1c1400;font-weight:900;font-size:.7rem;padding:4px 12px;border-radius:999px;margin-bottom:10px;letter-spacing:.06em}
.btn-row{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;height:50px;border-radius:14px;border:none;font-size:1.05rem;font-weight:800;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(180deg,#fcd34d,#f59e0b);color:#1c1400;box-shadow:0 4px 0 #b45309,0 8px 22px rgba(245,158,11,.4)}
.btn-secondary{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.16)}
.hint{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);font-size:.95rem;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.55);animation:hintPulse 1.5s ease-in-out infinite;pointer-events:none;padding:8px 16px;background:rgba(0,0,0,.25);border-radius:999px}
@keyframes hintPulse{0%,100%{opacity:.55;transform:translateX(-50%) translateY(0)}50%{opacity:1;transform:translateX(-50%) translateY(-5px)}}
.settings{position:absolute;inset:0;background:rgba(2,6,23,.75);z-index:40;display:flex;align-items:flex-end;justify-content:center;pointer-events:auto;animation:fadeIn .2s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.settings-sheet{width:100%;max-width:420px;background:#0f172a;border-radius:22px 22px 0 0;padding:20px 18px max(24px,env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.1)}
.settings-sheet h2{font-size:1.2rem;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-size:.95rem;font-weight:600}
.toggle{width:50px;height:30px;border-radius:99px;background:#334155;position:relative;cursor:pointer;border:none;flex-shrink:0}
.toggle.on{background:#22c55e}
.toggle::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.toggle.on::after{transform:translateX(20px)}
.footer-note{text-align:center;font-size:.72rem;color:rgba(248,250,252,.7);margin-top:16px;line-height:1.4}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){.panel,.hint{animation:none!important}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" aria-label="Chirp"></canvas>
<div id="hud">
  <div id="topHud" class="top-bar hidden">
    <button class="icon-btn" id="btnPause" data-ui="1" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <div class="score-block">
      <div class="score-num" id="scoreNum">0</div>
      <div class="score-sub">Best <span id="bestNum">0</span></div>
      <div class="power-row" id="powerRow"></div>
      <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
    </div>
    <button class="icon-btn" id="btnMute" data-ui="1" aria-label="Mute">
      <svg id="muteIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M11 5 6 9H2v6h4l5 4V5zm7.07 2.93a8 8 0 0 1 0 8.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    </button>
  </div>
  <div id="hint" class="hint hidden">Tap or Space to flap</div>
  <div id="menuPanel" class="panel" data-ui="1">
    <h1>🐦 Chirp</h1>
    <p class="tagline">Flap · Collect · Survive</p>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnPlay" data-ui="1">Play</button>
      <button class="btn btn-secondary" id="btnSettings" data-ui="1">Settings</button>
    </div>
    <p class="footer-note">Best: <span id="menuBest">0</span> · Coins: <span id="menuCoins">0</span></p>
  </div>
  <div id="pausePanel" class="panel hidden" data-ui="1">
    <h1>Paused</h1>
    <p class="tagline">Music paused</p>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnResume" data-ui="1">Resume</button>
      <button class="btn btn-secondary" id="btnHomeFromPause" data-ui="1">Menu</button>
    </div>
  </div>
  <div id="deadPanel" class="panel hidden" data-ui="1">
    <div id="newBestBadge" class="new-best hidden">NEW BEST</div>
    <h1>Game Over</h1>
    <div class="big-score" id="deadScore">0</div>
    <p class="best-line">Best <span id="deadBest">0</span> · +<span id="deadCoins">0</span> coins</p>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnRetry" data-ui="1">Play Again</button>
      <button class="btn btn-secondary" id="btnHomeFromDead" data-ui="1">Menu</button>
    </div>
  </div>
</div>
<div id="settings" class="settings hidden" data-ui="1">
  <div class="settings-sheet" data-ui="1">
    <h2>Settings
      <button class="icon-btn" id="btnCloseSettings" style="width:36px;height:36px" data-ui="1" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
      </button>
    </h2>
    <div class="toggle-row"><span>Sound</span><button class="toggle" id="togMute" data-ui="1"></button></div>
    <div class="toggle-row"><span>Haptics</span><button class="toggle on" id="togHaptics" data-ui="1"></button></div>
    <div class="toggle-row"><span>Screen shake</span><button class="toggle on" id="togShake" data-ui="1"></button></div>
    <p class="footer-note">Space / ↑ / Tap = flap<br>Esc / P = pause · M = mute</p>
  </div>
</div>
</div>
<script>
(function(){
"use strict";

/* ========= CONSTANTS ========= */
const STEP=1/60, MAX_ACC=0.1, GRAVITY=1950, FLAP_V=-460, MAX_FALL=780;
const BIRD_R=16, PIPE_W=72, GAP0=248, GAP1=158, SPACE0=270, SPD0=168, SPD1=330, METER_RATE=0.085;
const SAVE_KEY="chirp-v3";
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);

function lerpHex(a,b,t){
  const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
  const ar=(pa>>16)&255,ag=(pa>>8)&255,ab=pa&255;
  const br=(pb>>16)&255,bg=(pb>>8)&255,bb=pb&255;
  return `rgb(${Math.round(lerp(ar,br,t))},${Math.round(lerp(ag,bg,t))},${Math.round(lerp(ab,bb,t))})`;
}

/* ========= SAVE ========= */
const defaults={best:0,coins:0,muted:false,haptics:true,shake:true,seenTutorial:false};
function loadSave(){
  try{const r=localStorage.getItem(SAVE_KEY);if(!r)return{...defaults};
    const p=JSON.parse(r);return{...defaults,...p,best:Math.max(0,+p.best||0),coins:Math.max(0,+p.coins||0),muted:!!p.muted,haptics:p.haptics!==false,shake:p.shake!==false,seenTutorial:!!p.seenTutorial};
  }catch{return{...defaults}}
}
function writeSave(d){try{localStorage.setItem(SAVE_KEY,JSON.stringify(d))}catch{}}

/* ========= AUDIO ========= */
let bus=null,muted=false,musicOn=false,musicTimer=null,musicNote=0;
function ensureAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  if(!bus){const ctx=new AC({latencyHint:"interactive"});
    const master=ctx.createGain(),sfx=ctx.createGain(),music=ctx.createGain();
    sfx.gain.value=.7;music.gain.value=.15;master.gain.value=muted?0:1;
    sfx.connect(master);music.connect(master);master.connect(ctx.destination);
    bus={ctx,master,sfx,music}}
  if(bus.ctx.state==="suspended")void bus.ctx.resume();return bus;
}
function unlockAudio(){ensureAudio()}
function setMuted(n){muted=n;if(bus)bus.master.gain.setTargetAtTime(n?0:1,bus.ctx.currentTime,.03);if(n)stopMusic()}
function envGain(ctx,dest,t,peak,dur){const g=ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);g.connect(dest);return g}
function tone(freq,dur,type,peak){const b=ensureAudio();if(!b||muted)return;const t=b.ctx.currentTime;const o=b.ctx.createOscillator();o.type=type||"sine";o.frequency.value=freq;const g=envGain(b.ctx,b.sfx,t,peak||.2,dur);o.connect(g);o.start(t);o.stop(t+dur+.02)}
function noise(dur,peak,ff){const b=ensureAudio();if(!b||muted)return;const t=b.ctx.currentTime;const buf=b.ctx.createBuffer(1,Math.floor(b.ctx.sampleRate*dur),b.ctx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=b.ctx.createBufferSource();s.buffer=buf;const f=b.ctx.createBiquadFilter();f.type="bandpass";f.frequency.value=ff||1200;const g=envGain(b.ctx,b.sfx,t,peak||.15,dur);s.connect(f);f.connect(g);s.start(t);s.stop(t+dur+.02)}
function sfxFlap(){tone(520,.08,"triangle",.18);tone(780,.06,"sine",.08)}
function sfxScore(){tone(660,.07,"sine",.14);setTimeout(()=>tone(990,.1,"sine",.12),40)}
function sfxCoin(){tone(880,.06,"square",.1);setTimeout(()=>tone(1320,.1,"sine",.12),35)}
function sfxPower(){tone(320,.12,"sawtooth",.1);setTimeout(()=>tone(540,.14,"triangle",.12),50)}
function sfxBoost(){tone(180,.2,"sawtooth",.12);noise(.15,.1,800)}
function sfxCrash(){noise(.28,.22,400);tone(90,.25,"sawtooth",.15)}
function sfxUi(){tone(440,.05,"sine",.08)}
function sfxShieldBreak(){tone(200,.15,"sawtooth",.12);noise(.12,.1,600);setTimeout(()=>tone(400,.1,"triangle",.1),40)}
function scheduleNote(){
  if(!musicOn||muted||!bus)return;
  const notes=[262,330,392,523,392,330],t=bus.ctx.currentTime;
  const o=bus.ctx.createOscillator();o.type="triangle";o.frequency.value=notes[musicNote%notes.length];
  const g=bus.ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.04,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+.55);
  o.connect(g);g.connect(bus.music);o.start(t);o.stop(t+.6);musicNote++;
  musicTimer=setTimeout(scheduleNote,520);
}
function startMusic(){stopMusic();musicOn=true;musicNote=0;if(ensureAudio()&&!muted)scheduleNote()}
function stopMusic(){musicOn=false;if(musicTimer){clearTimeout(musicTimer);musicTimer=null}}
function pauseMusic(){stopMusic()}
function resumeMusic(){if(!muted)startMusic()}

/* ========= DRAW ========= */
const SKY=[
  {top:"#7ec8ff",mid:"#c8ebff",bot:"#efe4c4",sun:"#ffe082",night:0},
  {top:"#f4a06a",mid:"#f7c9a8",bot:"#8eb8d4",sun:"#ffd180",night:.25},
  {top:"#1b2a58",mid:"#3d4a86",bot:"#6a5a92",sun:"#f4f1de",night:1},
  {top:"#f3c48a",mid:"#f8d9b4",bot:"#9eccec",sun:"#ffcc80",night:.15},
];
function skyPalette(skyT){
  const x=((skyT%1)+1)%1,i=Math.floor(x*SKY.length),n=(i+1)%SKY.length,f=x*SKY.length-i;
  const a=SKY[i],b=SKY[n];
  return{top:lerpHex(a.top,b.top,f),mid:lerpHex(a.mid,b.mid,f),bot:lerpHex(a.bot,b.bot,f),sun:lerpHex(a.sun,b.sun,f),night:lerp(a.night,b.night,f)};
}
function roundRect(ctx,x,y,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath()}
function drawCloud(ctx,x,y,s,a){ctx.globalAlpha=a;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y,18*s,0,Math.PI*2);ctx.arc(x+22*s,y-6*s,24*s,0,Math.PI*2);ctx.arc(x+48*s,y+2*s,16*s,0,Math.PI*2);ctx.arc(x+28*s,y+10*s,14*s,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
function drawPipe(ctx,p,gy,night){
  const body=night>.5?"#2e5a3c":"#3d9e4e",lip=night>.5?"#3d7a4e":"#5cbf6a",edge=night>.5?"#1e3a28":"#2d6b38";
  const top=p.gapY-p.gap/2,bot=p.gapY+p.gap/2;
  ctx.fillStyle=body;ctx.fillRect(p.x,0,p.w,top-18);
  ctx.fillStyle=lip;roundRect(ctx,p.x-5,top-22,p.w+10,22,4);ctx.fill();ctx.strokeStyle=edge;ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=body;ctx.fillRect(p.x,bot+18,p.w,gy-bot-18);
  ctx.fillStyle=lip;roundRect(ctx,p.x-5,bot,p.w+10,22,4);ctx.fill();ctx.stroke();
}
function drawPickup(ctx,x,y,kind,t){
  ctx.save();ctx.translate(x,y);
  if(kind==="coin"){ctx.rotate(t*2);ctx.fillStyle="#ffd24a";ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();ctx.fillStyle="#f59e0b";ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff3a0";ctx.font="bold 11px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("$",0,1)}
  else if(kind==="shield"){ctx.fillStyle="#7dd3fc";ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(11,-4);ctx.lineTo(9,10);ctx.lineTo(0,14);ctx.lineTo(-9,10);ctx.lineTo(-11,-4);ctx.closePath();ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.stroke()}
  else if(kind==="boost"){ctx.fillStyle="#ffd24a";ctx.beginPath();ctx.moveTo(-2,-13);ctx.lineTo(6,-2);ctx.lineTo(1,-2);ctx.lineTo(8,13);ctx.lineTo(-6,0);ctx.lineTo(0,0);ctx.closePath();ctx.fill()}
  else{ctx.fillStyle="#fde68a";ctx.beginPath();ctx.ellipse(0,0,13,7,-.4,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#f59e0b";ctx.lineWidth=1.2;ctx.stroke()}
  ctx.restore();
}
function drawBird(ctx,bird,t,boosting,hasShield,dead){
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);ctx.scale(bird.squash,2-bird.squash);
  if(hasShield&&!dead){ctx.strokeStyle="rgba(125,211,252,.8)";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,24+Math.sin(t*6)*2,0,Math.PI*2);ctx.stroke();ctx.strokeStyle="rgba(125,211,252,.25)";ctx.lineWidth=7;ctx.beginPath();ctx.arc(0,0,27,0,Math.PI*2);ctx.stroke()}
  if(boosting&&!dead){ctx.fillStyle="rgba(255,210,74,.35)";ctx.beginPath();ctx.ellipse(-22,4,16,8,0,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle=dead?"#94a3b8":"#fbbf24";ctx.beginPath();ctx.ellipse(0,0,16,13,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=dead?"#cbd5e1":"#fef3c7";ctx.beginPath();ctx.ellipse(3,4,9,7,0,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.translate(-4,2);ctx.rotate(-.4+bird.wing*1.1);ctx.fillStyle=dead?"#64748b":"#f59e0b";ctx.beginPath();ctx.ellipse(0,0,11,6,0,0,Math.PI*2);ctx.fill();ctx.restore();
  ctx.fillStyle="#f97316";ctx.beginPath();ctx.moveTo(14,-2);ctx.lineTo(24,1);ctx.lineTo(14,5);ctx.closePath();ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(7,-5,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#0f172a";ctx.beginPath();ctx.arc(8.5,-5,2.4,0,Math.PI*2);ctx.fill();
  if(!dead){ctx.fillStyle="rgba(251,113,133,.45)";ctx.beginPath();ctx.arc(4,3,3.5,0,Math.PI*2);ctx.fill()}
  ctx.restore();
}

/* ========= GAME ========= */
class Game{
  constructor(canvas,onHud){
    this.canvas=canvas;this.ctx=canvas.getContext("2d",{alpha:false,desynchronized:true});
    this.onHud=onHud;this.raf=0;this.acc=0;this.last=0;this.running=false;
    this.w=390;this.h=844;this.groundY=700;this.birdX=118;
    this.phase="menu";this.t=0;this.skyT=.08;this.scroll=0;
    this.score=0;this.runCoins=0;this.newBest=false;
    this.deathLock=0;this.invuln=0;this.boostT=0;this.shield=false;this.wings=0;this.meter=0;
    this.lastGapY=0;this.hintUntilFlap=true;this.trauma=0;this.flash=0;
    this.bird=null;this.pipes=[];this.pickups=[];this.particles=[];this.pops=[];this.clouds=[];
    this.save=loadSave();this.reduced=matchMedia("(prefers-reduced-motion:reduce)").matches;
    this.hudDirty=true;this.unbind=[];
    setMuted(this.save.muted);this.hintUntilFlap=!this.save.seenTutorial;
    this.resetWorld(true);this.bind();this.layout();this.emitHud();
  }

  start(){
    if(this.running)return;this.running=true;this.last=performance.now();
    const loop=now=>{
      if(!this.running)return;
      try{
        let dt=(now-this.last)/1000;this.last=now;
        if(dt>.25)dt=.25;if(dt<0)dt=0;
        this.acc+=dt;if(this.acc>MAX_ACC)this.acc=MAX_ACC;
        while(this.acc>=STEP){this.step(STEP);this.acc-=STEP}
        this.render();
      }catch(err){
        console.error("Chirp frame error:",err);
        // keep looping no matter what
      }
      this.raf=requestAnimationFrame(loop);
    };
    this.raf=requestAnimationFrame(loop);
  }

  destroy(){this.running=false;cancelAnimationFrame(this.raf);this.unbind.forEach(f=>f());stopMusic()}

  playFromMenu(){unlockAudio();startMusic();sfxUi();this.resetWorld(false);this.phase="ready";this.hudDirty=true;this.emitHud()}
  pause(){if(this.phase!=="playing"&&this.phase!=="ready")return;this.phase="paused";pauseMusic();sfxUi();this.hudDirty=true;this.emitHud()}
  resume(){if(this.phase!=="paused")return;this.phase="playing";resumeAudio();resumeMusic();sfxUi();this.hudDirty=true;this.emitHud()}
  home(){sfxUi();stopMusic();this.resetWorld(true);this.phase="menu";this.hudDirty=true;this.emitHud()}
  retry(){if(this.phase==="dead"&&this.deathLock>0)return;sfxUi();unlockAudio();startMusic();this.resetWorld(false);this.phase="ready";this.hudDirty=true;this.emitHud()}

  toggleMute(){
    this.save.muted=!this.save.muted;setMuted(this.save.muted);
    if(!this.save.muted){unlockAudio();if(this.phase==="playing"||this.phase==="ready")startMusic();sfxUi()}
    else stopMusic();
    this.persist();this.hudDirty=true;this.emitHud();
  }
  toggleHaptics(){this.save.haptics=!this.save.haptics;this.persist();this.hudDirty=true;this.emitHud()}
  toggleShake(){this.save.shake=!this.save.shake;this.persist();this.hudDirty=true;this.emitHud()}

  flap(){
    unlockAudio();
    if(this.phase==="paused")return;
    if(this.phase==="dead"){if(this.deathLock>0)return;this.retry();return}
    if(this.phase==="menu"){this.playFromMenu();return}
    if(this.phase==="ready"){
      this.phase="playing";this.hintUntilFlap=false;
      if(!this.save.seenTutorial){this.save.seenTutorial=true;this.persist()}
    }
    if(this.phase!=="playing")return;
    this.bird.vy=FLAP_V;this.bird.wing=1;this.bird.squash=1.18;
    sfxFlap();this.buzz(12);this.burst(this.bird.x-8,this.bird.y+8,8,"puff","#fff6d0");
    this.hudDirty=true;this.emitHud();
  }

  snapshot(){return{phase:this.phase,score:this.score,best:this.save.best,coins:this.save.coins,runCoins:this.runCoins,shield:this.shield,wings:this.wings,boostT:this.boostT,meter:this.meter,invuln:this.invuln,newBest:this.newBest,showHint:this.hintUntilFlap&&(this.phase==="ready"||this.phase==="playing"),muted:this.save.muted,haptics:this.save.haptics,shake:this.save.shake}}
  emitHud(){this.hudDirty=false;this.onHud(this.snapshot())}
  persist(){writeSave(this.save)}
  buzz(ms){if(!this.save.haptics)return;try{if(navigator.vibrate)navigator.vibrate(ms)}catch{}}

  bind(){
    const onPtr=e=>{if(e.target&&e.target.closest&&e.target.closest("[data-ui]"))return;e.preventDefault();this.flap()};
    const onKey=e=>{
      if(e.repeat)return;
      if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){e.preventDefault();this.flap()}
      else if(e.code==="Escape"||e.code==="KeyP"){e.preventDefault();if(this.phase==="playing"||this.phase==="ready")this.pause();else if(this.phase==="paused")this.resume()}
      else if(e.code==="KeyM")this.toggleMute();
    };
    const onVis=()=>{if(document.hidden){if(this.phase==="playing")this.pause()}else{const b=ensureAudio();if(b&&b.ctx.state==="suspended")void b.ctx.resume();this.last=performance.now()}};
    this.canvas.addEventListener("pointerdown",onPtr);
    window.addEventListener("keydown",onKey);
    document.addEventListener("visibilitychange",onVis);
    this.unbind.push(()=>this.canvas.removeEventListener("pointerdown",onPtr));
    this.unbind.push(()=>window.removeEventListener("keydown",onKey));
    this.unbind.push(()=>document.removeEventListener("visibilitychange",onVis));
    this.resizeObs=new ResizeObserver(()=>this.layout());
    this.resizeObs.observe(this.canvas.parentElement||this.canvas);
    this.unbind.push(()=>this.resizeObs.disconnect());
  }

  layout(){
    const parent=this.canvas.parentElement||this.canvas;
    const rect=parent.getBoundingClientRect();
    const cssW=Math.max(1,rect.width),cssH=Math.max(1,rect.height);
    const dpr=Math.min(devicePixelRatio||1,2);
    this.canvas.width=Math.round(cssW*dpr);this.canvas.height=Math.round(cssH*dpr);
    this.canvas.style.width=cssW+"px";this.canvas.style.height=cssH+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.w=cssW;this.h=cssH;this.groundY=cssH*.78;this.birdX=cssW*.3;
    if(this.bird){this.bird.x=this.birdX;if(this.phase==="menu"||this.phase==="ready")this.bird.y=this.h*.42}
    this.seedClouds();
  }

  seedClouds(){this.clouds=Array.from({length:7},(_,i)=>({x:(i/7)*(this.w+200),y:40+((i*97)%Math.max(80,this.h*.38)),s:.7+(i%3)*.25,v:.15+(i%4)*.05}))}
  difficulty(){return clamp(this.score/42,0,1)}
  speed(){const d=this.difficulty();return lerp(SPD0,SPD1,d*d*(3-2*d))}
  gapSize(){return lerp(GAP0,GAP1,this.difficulty())}
  spacing(){return SPACE0+this.speed()*.12}

  resetWorld(menu){
    this.score=0;this.runCoins=0;this.newBest=false;this.deathLock=0;
    this.invuln=0;this.boostT=0;this.shield=false;this.wings=0;this.meter=0;
    this.trauma=0;this.flash=0;this.t=0;this.scroll=0;
    this.pipes=[];this.pickups=[];this.particles=[];this.pops=[];
    this.lastGapY=this.h*.42;
    this.bird={x:this.birdX,y:this.h*.42,vy:0,rot:0,wing:.5,squash:1,alive:true};
    if(!menu){const start=this.w*.58;for(let i=0;i<4;i++)this.spawnPipe(start+i*this.spacing())}
    this.hudDirty=true;
  }

  spawnPipe(x){
    const gap=this.gapSize(),margin=96;
    const minY=margin+gap/2,maxY=this.groundY-margin-gap/2;
    let gapY=rand(minY,maxY);
    const maxD=lerp(170,120,this.difficulty());
    gapY=clamp(gapY,this.lastGapY-maxD,this.lastGapY+maxD);
    gapY=clamp(gapY,minY,maxY);this.lastGapY=gapY;
    this.pipes.push({x,gapY,gap,w:PIPE_W,scored:false});
    const roll=Math.random();let kind=null;
    if(roll<.42)kind="coin";else if(roll<.55)kind="shield";else if(roll<.62)kind="boost";else if(roll<.70)kind="wing";
    if(kind)this.pickups.push({x:x+PIPE_W/2,y:gapY+rand(-gap*.18,gap*.18),kind,taken:false,bob:Math.random()*6});
  }

  step(dt){
    this.t+=dt;this.skyT+=dt*.012;
    if(this.flash>0)this.flash=Math.max(0,this.flash-dt*3.2);
    if(this.trauma>0)this.trauma=Math.max(0,this.trauma-dt*2.4);
    if(this.deathLock>0)this.deathLock-=dt;
    if(this.invuln>0)this.invuln=Math.max(0,this.invuln-dt);
    if(this.boostT>0)this.boostT=Math.max(0,this.boostT-dt);

    const moving=this.phase==="playing"||this.phase==="menu"||this.phase==="ready";
    if(moving){
      this.scroll+=this.speed()*dt*(this.phase==="menu"?.35:1);
      for(const c of this.clouds){c.x-=c.v*this.speed()*dt*.3;if(c.x<-100)c.x=this.w+80}
    }

    if(this.phase==="playing"){
      // Physics ALWAYS run while playing — shield/invuln never stop this
      const grav=this.boostT>0?GRAVITY*.55:GRAVITY;
      this.bird.vy=Math.min(MAX_FALL,this.bird.vy+grav*dt);
      this.bird.y+=this.bird.vy*dt;
      this.bird.rot=clamp(this.bird.vy/700,-.55,1.15);
      this.bird.wing=Math.max(0,this.bird.wing-dt*3.2);
      this.bird.squash=lerp(this.bird.squash,1,1-Math.exp(-10*dt));

      // Ceiling
      if(this.bird.y-BIRD_R<40){this.bird.y=40+BIRD_R;if(this.bird.vy<0)this.bird.vy=0}

      this.advancePipes(dt);
      this.collectPickups();
      this.checkHits();

      // Soft ground AFTER hits — only pin to floor if still overlapping and not bouncing
      if(this.bird.y+BIRD_R>this.groundY){
        this.bird.y=this.groundY-BIRD_R;
        if(this.bird.vy>0)this.bird.vy=0;
      }
    } else if(this.phase==="menu"||this.phase==="ready"){
      this.bird.y=this.h*.42+Math.sin(this.t*2.2)*10;
      this.bird.rot=Math.sin(this.t*2.2)*.12;
      this.bird.wing=.4+Math.sin(this.t*8)*.35;
      this.bird.squash=1;
    } else if(this.phase==="dead"){
      this.bird.vy=Math.min(MAX_FALL,this.bird.vy+GRAVITY*dt);
      this.bird.y+=this.bird.vy*dt;
      this.bird.rot=lerp(this.bird.rot,1.15,1-Math.exp(-6*dt));
      if(this.bird.y>this.groundY+80)this.bird.y=this.groundY+80;
    }

    this.stepParticles(dt);this.stepPops(dt);
    if(this.hudDirty)this.emitHud();
  }

  advancePipes(dt){
    const sp=this.speed()*dt*(this.boostT>0?1.35:1);
    for(const p of this.pipes)p.x-=sp;
    for(const u of this.pickups)u.x-=sp;
    for(const p of this.pipes){
      if(!p.scored&&p.x+p.w<this.bird.x){
        p.scored=true;
        const bonus=this.meter>=1?2:1;
        this.score+=bonus;
        this.meter=this.meter>=1?0:clamp(this.meter+METER_RATE,0,1);
        sfxScore();this.pop(this.bird.x+18,this.bird.y-24,bonus>1?"+2":"+1");
        this.burst(p.x+p.w/2,p.gapY,10,"star","#fff4a0");this.hudDirty=true;
      }
    }
    const space=this.spacing();
    this.pipes=this.pipes.filter(p=>p.x+p.w>-40);
    this.pickups=this.pickups.filter(u=>!u.taken&&u.x>-40);
    let right=0;for(const p of this.pipes)if(p.x>right)right=p.x;
    while(this.pipes.length<5){right+=space;this.spawnPipe(right)}
  }

  collectPickups(){
    for(const u of this.pickups){
      if(u.taken)continue;
      const dx=u.x-this.bird.x,dy=u.y-this.bird.y;
      if(dx*dx+dy*dy<36*36){u.taken=true;this.takePickup(u.kind,u.x,u.y)}
    }
  }

  takePickup(kind,x,y){
    if(kind==="coin"){this.runCoins++;this.save.coins++;sfxCoin();this.pop(x,y,"+1");this.burst(x,y,12,"spark","#ffd24a")}
    else if(kind==="shield"){this.shield=true;sfxPower();this.pop(x,y,"SHIELD");this.burst(x,y,14,"ring","#7dd3fc")}
    else if(kind==="boost"){this.boostT=2.2;this.invuln=Math.max(this.invuln,2.2);sfxBoost();this.pop(x,y,"BOOST");this.burst(x,y,16,"star","#fff3a0")}
    else{this.wings=Math.min(3,this.wings+1);sfxPower();this.pop(x,y,"WING");this.burst(x,y,12,"feather","#ffe27a")}
    this.persist();this.hudDirty=true;this.buzz(18);
  }

  /**
   * HIT LOGIC — the critical fix
   * - invuln > 0  → ignore ALL lethal hits (pass through pipes)
   * - shield on   → break shield, grant invuln, bounce, KEEP PLAYING
   * - otherwise   → die
   * Never changes phase to anything except dead. Never stops the loop.
   */
  checkHits(){
    if(this.invuln>0)return; // fully safe — fly through everything

    const b=this.bird;

    // Ground
    if(b.y+BIRD_R>=this.groundY-0.5){
      this.resolveHit("ground");
      return;
    }

    // Pipes
    for(const p of this.pipes){
      if(b.x+BIRD_R<p.x||b.x-BIRD_R>p.x+p.w)continue;
      const top=p.gapY-p.gap/2,bot=p.gapY+p.gap/2;
      if(b.y-BIRD_R<top||b.y+BIRD_R>bot){
        this.resolveHit("pipe",p);
        return;
      }
    }
  }

  resolveHit(reason,pipe){
    if(this.invuln>0)return;

    if(this.shield){
      // Shield absorbs ONE hit — game MUST continue
      this.shield=false;
      this.invuln=1.8;
      this.flash=.65;
      this.trauma=.55;
      this.phase="playing"; // force continue even if something else paused
      try{sfxShieldBreak()}catch(e){}
      try{
        this.burst(this.bird.x,this.bird.y,22,"ring","#7dd3fc");
        this.burst(this.bird.x,this.bird.y,12,"spark","#fff");
      }catch(e){}
      this.buzz(30);

      if(reason==="ground"){
        this.bird.y=this.groundY-BIRD_R-8;
        this.bird.vy=FLAP_V*.8;
      } else if(reason==="pipe"&&pipe){
        // push into gap center and bounce up
        this.bird.y=pipe.gapY;
        this.bird.vy=FLAP_V*.65;
      } else {
        this.bird.vy=FLAP_V*.55;
      }
      this.hudDirty=true;
      this.emitHud();
      return;
    }

    this.die();
  }

  die(){
    if(this.phase==="dead")return;
    this.phase="dead";
    this.bird.alive=false;
    this.bird.vy=-180;
    this.deathLock=.75;
    this.flash=.85;
    this.trauma=.9;
    stopMusic();
    sfxCrash();
    this.buzz(40);
    this.burst(this.bird.x,this.bird.y,22,"feather","#fbbf24");
    this.burst(this.bird.x,this.bird.y,14,"puff","#fff");
    if(this.score>this.save.best){this.save.best=this.score;this.newBest=true}
    this.persist();this.hudDirty=true;this.emitHud();
  }

  burst(x,y,n,kind,color){
    if(this.reduced)n=Math.min(n,6);
    for(let i=0;i<n;i++){
      const ang=Math.random()*Math.PI*2,sp=rand(40,220);
      this.particles.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-40,life:rand(.35,.75),max:rand(.35,.75),size:rand(2,6),color,kind});
    }
  }
  pop(x,y,text){this.pops.push({x,y,text,life:.7,max:.7})}
  stepParticles(dt){for(const p of this.particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=280*dt;p.vx*=.98}this.particles=this.particles.filter(p=>p.life>0)}
  stepPops(dt){for(const p of this.pops)p.life-=dt;this.pops=this.pops.filter(p=>p.life>0)}

  render(){
    let sx=0,sy=0;
    if(this.save.shake&&this.trauma>0&&!this.reduced){const mag=this.trauma*this.trauma*14;sx=(Math.random()-.5)*mag;sy=(Math.random()-.5)*mag}
    const ctx=this.ctx,w=this.w,h=this.h;
    ctx.save();ctx.translate(sx,sy);
    const pal=skyPalette(this.skyT);
    const grd=ctx.createLinearGradient(0,0,0,h);
    grd.addColorStop(0,pal.top);grd.addColorStop(.45,pal.mid);grd.addColorStop(1,pal.bot);
    ctx.fillStyle=grd;ctx.fillRect(-20,-20,w+40,h+40);
    const sunY=lerp(h*.18,h*.55,pal.night);
    ctx.beginPath();ctx.arc(w*.78,sunY,28+pal.night*8,0,Math.PI*2);ctx.fillStyle=pal.sun;ctx.globalAlpha=.95-pal.night*.25;ctx.fill();ctx.globalAlpha=1;
    if(pal.night>.4){ctx.globalAlpha=(pal.night-.4)*1.4;for(let i=0;i<28;i++){const sx2=((i*97+this.scroll*.05)%(w+40))-20,sy2=20+((i*53)%(h*.4));ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(sx2,sy2,1.2+(i%3)*.4,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
    for(const c of this.clouds){const cx=((c.x-this.scroll*c.v)%(w+160))-80;drawCloud(ctx,cx,c.y,c.s,.55+pal.night*.15)}
    for(const p of this.pipes)drawPipe(ctx,p,this.groundY,pal.night);
    for(const u of this.pickups){if(u.taken)continue;drawPickup(ctx,u.x,u.y+Math.sin(this.t*3.2+u.bob)*5,u.kind,this.t)}
    // Bird blink during invuln
    if(this.bird){
      const blink=this.invuln>0&&!this.shield&&this.phase==="playing";
      if(!blink||Math.floor(this.t*14)%2===0)drawBird(ctx,this.bird,this.t,this.boostT>0,this.shield,this.phase==="dead");
    }
    for(const p of this.particles){const life=p.life/p.max;ctx.globalAlpha=clamp(life*1.4,0,1);ctx.fillStyle=p.color;if(p.kind==="ring"){ctx.strokeStyle=p.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1.2-life),0,Math.PI*2);ctx.stroke()}else{ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.5,p.size*life),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
    ctx.fillStyle=pal.night>.5?"#2d3a28":"#6b9e4e";ctx.fillRect(-10,this.groundY,w+20,h-this.groundY+20);
    ctx.fillStyle=pal.night>.5?"#3d5234":"#8bc34a";ctx.fillRect(-10,this.groundY,w+20,14);
    for(const p of this.pops){const life=p.life/p.max;ctx.globalAlpha=clamp(life*1.6,0,1);ctx.font=`bold ${18+(1-life)*8}px system-ui`;ctx.textAlign="center";ctx.fillStyle="#fff";ctx.strokeStyle="rgba(0,0,0,.35)";ctx.lineWidth=3;ctx.strokeText(p.text,p.x,p.y-(1-life)*28);ctx.fillText(p.text,p.x,p.y-(1-life)*28);ctx.globalAlpha=1}
    if(this.flash>0){ctx.fillStyle=`rgba(255,255,255,${this.flash*.55})`;ctx.fillRect(-20,-20,w+40,h+40)}
    ctx.restore();
  }
}

/* ========= UI ========= */
const canvas=document.getElementById("c"),$=id=>document.getElementById(id);
const els={topHud:$("topHud"),scoreNum:$("scoreNum"),bestNum:$("bestNum"),powerRow:$("powerRow"),meterFill:$("meterFill"),hint:$("hint"),menuPanel:$("menuPanel"),pausePanel:$("pausePanel"),deadPanel:$("deadPanel"),newBestBadge:$("newBestBadge"),deadScore:$("deadScore"),deadBest:$("deadBest"),deadCoins:$("deadCoins"),menuBest:$("menuBest"),menuCoins:$("menuCoins"),settings:$("settings"),muteIcon:$("muteIcon"),togMute:$("togMute"),togHaptics:$("togHaptics"),togShake:$("togShake")};

function onHud(hud){
  const playing=hud.phase==="playing"||hud.phase==="ready";
  els.topHud.classList.toggle("hidden",!(playing||hud.phase==="paused"));
  els.menuPanel.classList.toggle("hidden",hud.phase!=="menu");
  els.pausePanel.classList.toggle("hidden",hud.phase!=="paused");
  els.deadPanel.classList.toggle("hidden",hud.phase!=="dead");
  els.hint.classList.toggle("hidden",!hud.showHint);
  els.scoreNum.textContent=String(hud.score);
  els.bestNum.textContent=String(hud.best);
  els.menuBest.textContent=String(hud.best);
  els.menuCoins.textContent=String(hud.coins);
  els.deadScore.textContent=String(hud.score);
  els.deadBest.textContent=String(hud.best);
  els.deadCoins.textContent=String(hud.runCoins);
  els.newBestBadge.classList.toggle("hidden",!hud.newBest);
  els.meterFill.style.width=Math.round(hud.meter*100)+"%";
  let pills="";
  if(hud.shield)pills+='<span class="pill shield">🛡 Shield</span>';
  if(hud.invuln>0&&!hud.shield)pills+='<span class="pill safe">✨ Safe</span>';
  if(hud.boostT>0)pills+='<span class="pill boost">⚡ Boost</span>';
  if(hud.wings>0)pills+='<span class="pill wing">🪶 ×'+hud.wings+'</span>';
  if(hud.runCoins>0)pills+='<span class="pill coins">🪙 '+hud.runCoins+'</span>';
  els.powerRow.innerHTML=pills;
  els.muteIcon.innerHTML=hud.muted
    ?'<path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="2"/><line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="2"/>'
    :'<path d="M11 5 6 9H2v6h4l5 4V5zm7.07 2.93a8 8 0 0 1 0 8.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
  els.togMute.classList.toggle("on",!hud.muted);
  els.togHaptics.classList.toggle("on",hud.haptics);
  els.togShake.classList.toggle("on",hud.shake);
}

$("btnPlay").onclick=()=>game.playFromMenu();
$("btnResume").onclick=()=>game.resume();
$("btnRetry").onclick=()=>game.retry();
$("btnHomeFromPause").onclick=()=>game.home();
$("btnHomeFromDead").onclick=()=>game.home();
$("btnPause").onclick=()=>game.pause();
$("btnMute").onclick=()=>game.toggleMute();
$("btnSettings").onclick=()=>els.settings.classList.remove("hidden");
$("btnCloseSettings").onclick=()=>els.settings.classList.add("hidden");
els.settings.onclick=e=>{if(e.target===els.settings)els.settings.classList.add("hidden")};
els.togMute.onclick=()=>game.toggleMute();
els.togHaptics.onclick=()=>game.toggleHaptics();
els.togShake.onclick=()=>game.toggleShake();

const game=new Game(canvas,onHud);
game.start();
window.__chirp=game;
})();
